# Coverage is collected by kcov (.github/actions/coverage) over test/functions only;
# scripts/functions is the measured tree. The measurement is deterministic: three
# full runs on an unchanged tree produce byte-identical per-line hits, so a moved
# number means the code moved (#307).
#
# It used to be collected by bashcov, which handed bash a non-blocking pipe and
# silently dropped about three quarters of the trace, so both statuses were
# `informational: true` for a while — the number wandered ±4 points on an
# unchanged tree and a red status nobody could act on is worse than none. The
# post-fix baseline on main was 81.1% (1634 / 2015), against 54.1% collected
# through the lossy pipe.
coverage:
  status:
    project:
      default:
        # `auto` compares to the base commit. The 1% threshold is not a noise
        # allowance — the number is deterministic now — but ordinary refactors
        # legitimately move a 2000-line denominator by a few lines, and a
        # required-looking red status on a half-point dip trains everyone to
        # ignore the one place a real regression would show.
        target: auto
        threshold: 1%
    patch:
      default:
        # Deliberately informational, and not because of measurement noise.
        # kcov's bash parser, like bashcov's, scores the body of an embedded
        # awk/sed program as bash statements; those lines only ever execute
        # inside awk, so they can never be hit, and a diff that is mostly
        # embedded awk fails patch no matter how well tested it is (#307 item 3,
        # e.g. sdkman_jdks.bash 69-79). The number is still posted for reading.
        informational: true
        target: 50%
