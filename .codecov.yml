# Coverage is collected by kcov (.github/actions/coverage) as four independent
# measurements, uploaded from coverage.yml under four flags:
#
#   functions — scripts/functions, exercised by test/functions. The helper
#               library the repo ships. This is the headline number.
#   gates     — .ci/ plus .githooks/, exercised by test/ci. The tooling that
#               grades the library.
#   root      — the six repo-root runners (check-scripts, run-all-checks,
#               run-install-scripts, run-set-up-scripts, run-tests,
#               shellcheck-scripts), exercised by test/root.
#   shims     — scripts/shims/, exercised by test/shims. The pkill/killall
#               guards the claude wrapper puts on PATH.
#
# They are kept apart on purpose. Merging them would change what the headline
# number means, and a regression in one tree must not be masked by another's
# size. `project.default` is therefore pinned to `flags: [functions]` so
# `codecov/project` measures scripts/functions alone; each other measurement
# gets its own status (`codecov/project/<flag>`). The README badge is likewise
# pinned with `?flag=functions`.
#
# Measurement is deterministic: an unchanged tree produces the same per-line
# hits, so a moved number means the code moved.
#
# Most lines left uncovered are kcov lexer artifacts (embedded awk/jq program
# bodies, `done <redirect>` lines, bare subshell parens) that no test can hit.
flags:
  functions:
    # carryforward keeps a flag's last known coverage when its job did not
    # upload. Without it a transient failure in one of the coverage jobs
    # reads as that tree's coverage collapsing to nothing, which is a false
    # alarm indistinguishable from a real one.
    carryforward: true
  gates:
    carryforward: true
  root:
    carryforward: true
  shims:
    carryforward: true
coverage:
  status:
    project:
      default:
        # Scoped to the functions flag so this status measures the helper
        # library alone. Widening it to more flags would silently redefine
        # the one number this repo gates on.
        flags:
          - functions
        # `auto` compares to the base commit. The 1% threshold is not a noise
        # allowance — the number is deterministic — but ordinary refactors
        # legitimately move a 2000-line denominator by a few lines, and a
        # required-looking red status on a half-point dip trains everyone to
        # ignore the one place a real regression would show.
        target: auto
        threshold: 1%
      gates:
        flags:
          - gates
        # A real target, on the same terms as `default` above. kcov is
        # deterministic, so an unchanged tree reports the same number.
        target: auto
        threshold: 1%
      root:
        flags:
          - root
        # Same terms as `gates` above.
        target: auto
        threshold: 1%
      shims:
        flags:
          - shims
        # Same terms as `gates` above.
        target: auto
        threshold: 1%
    patch:
      default:
        # Deliberately informational, and not because of measurement noise.
        # kcov's bash parser scores the body of an embedded awk/sed program as
        # bash statements; those lines only ever execute inside awk, so they can
        # never be hit, and a diff that is mostly embedded awk fails patch no
        # matter how well tested it is (e.g. sdkman_jdks.bash 69-79). The number
        # is still posted for reading.
        informational: true
        target: 50%
