# Coverage is collected by kcov (.github/actions/coverage) as two independent
# measurements, uploaded from coverage.yml under two flags:
#
#   functions — scripts/functions, exercised by test/functions. The helper
#               library the repo ships. This is the headline number.
#   gates     — .ci/ plus the repo-root runners, exercised by test/ci and
#               test/root. The tooling that grades the library.
#
# They are kept apart on purpose. Merging them would change what the headline
# number means, and a regression in one tree must not be masked by the other's
# size. `project.default` is therefore pinned to `flags: [functions]` so
# `codecov/project` measures exactly what it measured before the gates flag
# existed; the gates measurement gets its own status. The README badge is
# likewise pinned with `?flag=functions`.
#
# Both measurements are deterministic: three full runs on an unchanged tree
# produce byte-identical per-line hits, so a moved number means the code moved.
#
# The functions baseline on main is 96.5% (1944 / 2015). Roughly 60 of the 71
# lines still uncovered are lexer artifacts that can never be hit; see CLAUDE.md.
flags:
  functions:
    # carryforward keeps a flag's last known coverage when its job did not
    # upload. Without it a transient failure in one of the two coverage jobs
    # reads as that tree's coverage collapsing to nothing, which is a false
    # alarm indistinguishable from a real one.
    carryforward: true
  gates:
    carryforward: true
coverage:
  status:
    project:
      default:
        # Scoped to the functions flag so this status keeps its pre-existing
        # meaning exactly. Widening it to both flags would silently redefine
        # the one number this repo gates on.
        flags:
          - functions
        # `auto` compares to the base commit. The 1% threshold is not a noise
        # allowance — the number is deterministic now — but ordinary refactors
        # legitimately move a 2000-line denominator by a few lines, and a
        # required-looking red status on a half-point dip trains everyone to
        # ignore the one place a real regression would show.
        target: auto
        threshold: 1%
      gates:
        flags:
          - gates
        # A real target, on the same terms as `default` above. Two independent
        # CI runs measure the same tree to five significant figures, which is
        # the same determinism the functions scope has.
        target: auto
        threshold: 1%
    patch:
      default:
        # Deliberately informational, and not because of measurement noise.
        # kcov's bash parser scores the body of an embedded awk/sed program as
        # bash statements; those lines only ever execute inside awk, so they can
        # never be hit, and a diff that is mostly embedded awk fails patch no
        # matter how well tested it is (e.g. sdkman_jdks.bash 69-79). The number
        # is still posted for reading.
        informational: true
        target: 50%
