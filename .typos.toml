[files]
extend-exclude = [
  # Third-party scripts copied verbatim; never edited, so a typo here would fail
  # the gate with no legal fix. The path is scripts/other/, not other/ — the bare
  # form matched nothing after the scripts/ reorganisation and silently left this
  # tree scanned, the same way .treefmt.nix and .yamllint.yml would have.
  "scripts/other/**",
  "lib/**",
  ".shdoc/**",
]

[default.extend-words]
# gir = Debian `gir1.2-*` package prefix (GObject-Introspection); not a typo.
gir = "gir"
# ba = matches the `(ba)?sh` shebang regex fragment in functions/shell_scripts.bash; not a typo.
ba = "ba"
# BRE = POSIX Basic Regular Expression (sed); not a typo of "BE"/"BRIE".
bre = "bre"
# eror = intentional invalid value used in check-upload-artifact-strict.bats to
# verify the checker rejects unknown if-no-files-found values; not a typo.
eror = "eror"
