name: coverage
# Caller must run actions/checkout and ./.github/actions/setup before this
# composite: a local action cannot perform its own initial checkout, and the
# bashcov invocation below needs the Nix devShell that setup installs.
description: Run the BATS suite under bashcov, producing coverage/coverage.xml.
runs:
  using: composite
  steps:
    - name: Run BATS under bashcov
      shell: bash
      # bashcov + simplecov-cobertura come from the flake's bundlerEnv
      # (.nix/bashcov/gemset.nix); kcov and bats are in the flake too. Fully hermetic.
      #
      # --root MUST be absolute. With a relative root, Runner#tracked_files walks
      # `Pathname.new(root).find` and yields relative paths, which SimpleCov's built-in
      # root filter then discards — while executed files, keyed by absolute realpath,
      # survive. The effect is that every never-executed file silently leaves the report
      # instead of scoring 0%, inflating the percentage and making the denominator move
      # from run to run. Proven by A/B on a two-file fixture: `--root .` reported
      # 66.67% (2/3) with the uncovered file absent, `--root "$PWD"` 40.00% (2/5) with
      # it present (#307). git rev-parse rather than $PWD so the root is the repo, not
      # wherever the step happened to be invoked from — the same rule the .ci/ gates
      # follow. Only bash and git are needed here, both of which .ci/in-devshell already
      # requires from the host.
      run: ./.ci/in-devshell bashcov --root "$(git rev-parse --show-toplevel)" -- bats --recursive test/functions
