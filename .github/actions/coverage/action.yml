name: coverage
# Caller must run actions/checkout and ./.github/actions/setup before this
# composite: a local action cannot perform its own initial checkout, and the
# kcov invocation below needs the Nix devShell that setup installs.
description: >-
  Run one BATS suite under kcov, producing $RUNNER_TEMP/coverage/<scope>/bats/cobertura.xml.
inputs:
  scope:
    # The two measurements are kept separate all the way to Codecov, where they
    # are uploaded under the `functions` and `gates` flags. Merging them would
    # change what the headline number means: scripts/functions is the helper
    # library the repo ships, and .ci/ plus .githooks/ plus the root runners
    # are the gates that grade it. A regression in one must not be masked by the
    # other's size.
    description: >-
      Which tree to measure. `functions` covers scripts/functions, exercised by test/functions. `gates` covers .ci/, .githooks/, and the repo-root runners, exercised by test/ci and test/root.
    required: true
runs:
  using: composite
  steps:
    - name: Run BATS under kcov
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      # kcov comes from the flake devShell (flake.nix carries a one-line PS4 patch
      # on it — see the comment there). Its C++ reader keeps up with this suite's
      # trace volume, and three full runs on an unchanged tree produce
      # byte-identical per-line hits.
      #
      # --bash-parser: kcov defaults to /bin/bash, the runner's bash, to parse the
      # scripts it reports on. The suite runs under the devShell's bash, so the
      # parser and the executor must be the same binary.
      # --bash-dont-parse-binary-dir: otherwise kcov also parses every script in
      # bats' own bin/ and reports on it.
      # --include-path: only the scope's own tree is coverage-relevant — test/ is
      # the suite, and the other scripts/ dirs are unmeasured payload.
      # --bash-parse-files-in-dir: kcov only reports files it saw execute. This
      # walks the directory so a never-executed script scores 0% instead of
      # vanishing from the denominator. It takes a comma-separated list and does
      # not recurse, which is why the gates scope names the repo root separately
      # from .ci/ — the root runners are files, not a directory.
      #
      # Every path is absolute via git rev-parse rather than $PWD, so the root is
      # the repo, not wherever the step happened to be invoked from — the rule
      # the .ci/ gates follow. Only bash and git are needed here, both of which
      # .ci/in-devshell already requires from the host.
      #
      # The report goes to $RUNNER_TEMP, outside the tree, because kcov writes
      # shebang-bearing helper scripts (bash-helper.sh and friends) into its output
      # directory, and check-scripts walks the filesystem — a coverage/ dir inside
      # the repo would hand those to shfmt and shellcheck. $RUNNER_TEMP is on
      # .ci/in-devshell's keep list. The cobertura.xml lands under a subdirectory
      # named after the traced binary, hence <scope>/bats/.
      run: |
        set -Eeuo pipefail
        repo="$(git rev-parse --show-toplevel)"
        case "${SCOPE}" in
          functions)
            kcov_args=(
              --include-path="${repo}/scripts/functions"
              --bash-parse-files-in-dir="${repo}/scripts/functions"
            )
            suites=('test/functions')
            ;;
          gates)
            kcov_args=(
              --include-path="${repo}/.ci,${repo}/.githooks,${repo}/check-scripts,${repo}/run-all-checks,${repo}/run-install-scripts,${repo}/run-set-up-scripts,${repo}/run-tests,${repo}/shellcheck-scripts"
              --bash-parse-files-in-dir="${repo}/.ci,${repo}/.githooks,${repo}"
              # .ci/required-tools is data, not code: a comment-and-tool-name
              # list with no shebang and no executable bit, consumed by
              # check-devshell-provides and check-tool-declarations. Walking
              # .ci/ hands it to kcov's bash lexer, which scores its 20 bare
              # tool names as unhittable statements. Those lines are not code
              # and do not belong in a code-coverage denominator.
              --exclude-path="${repo}/.ci/required-tools"
            )
            suites=('test/ci' 'test/root')
            ;;
          *)
            printf 'coverage: unknown scope %s (expected functions or gates)\n' "${SCOPE}" >&2
            exit 1
            ;;
        esac
        # kcov creates its output directory, but only one level deep, and the
        # per-scope subdirectory makes it two: without this it dies with
        # "Can't write helper" before running a single test.
        mkdir --parents "${RUNNER_TEMP}/coverage/${SCOPE}"
        # The scope's kcov flags and its suite list are both variable-length, so
        # they are passed as one argument vector split on a literal `--`.
        ./.ci/in-devshell bash -c '
          kcov_args=()
          while [[ "$1" != "--" ]]; do
            kcov_args+=("$1")
            shift
          done
          shift
          scope="$1"
          shift
          kcov \
            --bash-parser="$(type -P bash)" \
            --bash-dont-parse-binary-dir \
            "${kcov_args[@]}" \
            "${RUNNER_TEMP}/coverage/${scope}" \
            bats --recursive "$@"
        ' _ "${kcov_args[@]}" -- "${SCOPE}" "${suites[@]}"
