name: protect-main-drift-check
# Scheduled monitor (NOT a PR gate): compares the live protect-main ruleset
# against the in-tree mirror. Uses RULESET_READ_TOKEN (fine-grained PAT,
# Administration: read-only) because GITHUB_TOKEN cannot read rulesets. Never
# runs on pull_request — check-pr-workflows-no-secrets forbids non-GITHUB_TOKEN
# secrets on PR-triggered workflows (fork-PR exfiltration risk).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  protect-main-drift-check:
    name: protect-main-drift-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Fetch live ruleset and diff against in-tree mirror
        env:
          GH_TOKEN: ${{ secrets.RULESET_READ_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # shellcheck disable=SC2016 # GH_REPO and the gh --jq selector must expand
          # inside the in-devshell bash -c (which has gh/jq from the flake), not in
          # the runner shell — single quotes are intentional.
          ./.ci/in-devshell bash -c '
            set -Eeuo pipefail
            IFS=$'"'"'\n\t'"'"'
            live="$(mktemp)"
            rs_id="$(gh api "repos/${GH_REPO}/rulesets" \
              --jq ".[] | select(.name == \"protect-main\") | .id")"
            if [[ -z "${rs_id}" ]]; then
              printf "no protect-main ruleset found on the live repo\n" >&2
              exit 1
            fi
            gh api "repos/${GH_REPO}/rulesets/${rs_id}" > "${live}"
            ./.ci/diff-ruleset "${live}" .github/rulesets/protect-main.json
          '
