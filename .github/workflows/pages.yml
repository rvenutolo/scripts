name: Pages
on:
  push:
    branches: [main]
  # Manual trigger: lets the docs site be rebuilt on demand, and lets this
  # workflow be exercised from a branch. A branch dispatch builds and uploads
  # the artifact but cannot publish — the github-pages environment carries a
  # branch policy that restricts deployments to main, so the `deploy` job is
  # rejected and the live site is untouched. Verify a branch's docs from the
  # uploaded artifact; a failed `deploy` on a dispatched run is expected.
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build docs
        run: |
          set -Eeuo pipefail
          ./.ci/in-devshell ./.ci/build-docs
          ./.ci/in-devshell mkdocs build --strict --config-file .mkdocs.yml
      - name: Generate BATS test count badge
        run: |
          set -Eeuo pipefail
          count="$(./.ci/in-devshell bats --count --recursive test/functions)"
          # shellcheck disable=SC2016 # $count is a jq variable bound by --arg, not
          # a shell one — single quotes intended. shellcheck only special-cases the
          # jq program when jq is the command word, which it no longer is here.
          ./.ci/in-devshell jq --null-input --arg count "${count}" \
            '{schemaVersion: 1, label: "tests", message: $count, color: "blue"}' \
            > site/badge.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
