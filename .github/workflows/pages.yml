name: Pages
on:
  push:
    branches: [main]
  # Manual trigger: lets the docs site be rebuilt on demand, and lets this
  # workflow be exercised from a branch (a dispatched run publishes that
  # branch's docs, so dispatch deliberately).
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 codeload.github.com:443 files.pythonhosted.org:443 github.com:443 objects.githubusercontent.com:443 pypi.org:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Install shfmt (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Authenticate the API call: unauthenticated requests share a 60/hr
          # per-IP limit on shared runners and intermittently 403, which left
          # SHFMT_VERSION empty and produced a broken download URL.
          SHFMT_VERSION=$(curl --disable --fail --silent --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/mvdan/sh/releases/latest \
            | jq --raw-output .tag_name)
          if [[ -z "${SHFMT_VERSION}" || "${SHFMT_VERSION}" == "null" ]]; then
            echo "Failed to resolve latest shfmt version" >&2
            exit 1
          fi
          # Install into a user-writable dir rather than /usr/local/bin so the
          # step needs no sudo, which lets this job run under disable-sudo.
          # shfmt is required because .ci/build-docs calls shell_scripts::find,
          # which shells out to `shfmt --find`.
          mkdir --parents "${RUNNER_TEMP}/bin"
          curl --disable --fail --silent --location --output "${RUNNER_TEMP}/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x "${RUNNER_TEMP}/bin/shfmt"
          printf '%s\n' "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Build docs
        env:
          SCRIPTS_DIR: ${{ github.workspace }}/scripts
        run: |
          set -Eeuo pipefail
          ./.ci/build-docs
          mkdocs build --strict --config-file .mkdocs.yml
      - name: Generate BATS test count badge
        run: |
          set -Eeuo pipefail
          count=$(./test/bats/bin/bats --count --recursive test/functions)
          jq --null-input --arg count "${count}" \
            '{schemaVersion: 1, label: "tests", message: $count, color: "blue"}' \
            > site/badge.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 github.com:443
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
