name: Pages
on:
  push:
    branches: [main]
  # Manual trigger: lets the docs site be rebuilt on demand, and lets this
  # workflow be exercised from a branch (a dispatched run publishes that
  # branch's docs, so dispatch deliberately).
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 rubygems.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build docs
        env:
          SCRIPTS_DIR: ${{ github.workspace }}/scripts
        run: |
          set -Eeuo pipefail
          nix develop --command ./.ci/build-docs
          nix develop --command mkdocs build --strict --config-file .mkdocs.yml
      - name: Generate BATS test count badge
        run: |
          set -Eeuo pipefail
          count=$(./test/bats/bin/bats --count --recursive test/functions)
          jq --null-input --arg count "${count}" \
            '{schemaVersion: 1, label: "tests", message: $count, color: "blue"}' \
            > site/badge.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
