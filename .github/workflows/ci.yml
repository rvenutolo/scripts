name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-scripts:
    name: check-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run check-scripts
        run: ./.ci/in-devshell ./check-scripts
  # Decides once whether the BATS suite must run, for every job that runs it.
  # No Nix: .ci/decide-changed-tests needs only bash and git.
  changed-tests:
    name: changed-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443 codeload.github.com:443 github.com:443 objects.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so changed-tests can diff the PR range
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - id: changes
        uses: ./.github/actions/changed-tests # zizmor: ignore[self-repository]
  # Each shard runs the slice of the suite .ci/plan-test-shards assigns to its
  # index. The planner is deterministic, so the shards partition the suite
  # without a planning job ahead of them. The shard count and index come from
  # strategy.job-total and strategy.job-index, so the matrix length is the only
  # place the count is written: a hand-kept count that disagreed with it would
  # drop or duplicate a slice of the suite without failing any shard.
  bats-shard:
    name: bats-shard (${{ strategy.job-index }})
    needs: changed-tests
    if: needs.changed-tests.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_COUNT: ${{ strategy.job-total }}
      SHARD_INDEX: ${{ strategy.job-index }}
      # .ci/in-devshell clears the environment; these cross into it by name.
      IN_DEVSHELL_KEEP: SHARD_COUNT SHARD_INDEX
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run BATS shard
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC2016 # $(nproc), RUNNER_TEMP and the shard variables must expand
          # inside the in-devshell bash -c, on the hermetic side of the boundary,
          # where the keep lists carry them; single quotes intended.
          # ./run-tests forwards its arguments to bats and adds its repo-mutation
          # tripwire. Every shard's junit report is named after its index, so the
          # reports do not overwrite each other when the bats job merges them.
          ./.ci/in-devshell bash -c '
            set -Eeuo pipefail
            ./.ci/plan-test-shards "${SHARD_COUNT}" "${SHARD_INDEX}" > "${RUNNER_TEMP}/bats-shard-files.txt"
            mapfile -t files < "${RUNNER_TEMP}/bats-shard-files.txt"
            junit_dir="${RUNNER_TEMP}/bats-junit"
            mkdir --parents "${junit_dir}"
            status=0
            ./run-tests --jobs "$(nproc)" --print-output-on-failure \
              --report-formatter junit --output "${junit_dir}" \
              "${files[@]}" || status=$?
            # No report means run-tests died before bats ran; its status is the
            # error to surface, not a failed rename.
            if [[ -f "${junit_dir}/report.xml" ]]; then
              mv "${junit_dir}/report.xml" "${junit_dir}/report-${SHARD_INDEX}.xml"
            fi
            exit "${status}"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bats-junit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bats-junit/
          if-no-files-found: error
  # The required `bats` check. It must always run and report a status, so it
  # depends on the shards with `if: always()` and decides green or red itself:
  # green when changed-tests found nothing test-relevant, or when every shard
  # passed; red otherwise, including when changed-tests itself failed. No Nix.
  bats:
    name: bats
    needs: [changed-tests, bats-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # checks: write lets action-junit-report create the BATS results check run.
      checks: write
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443
      - id: verdict
        env:
          CHANGED_RESULT: ${{ needs.changed-tests.result }}
          RUN: ${{ needs.changed-tests.outputs.run }}
          SHARDS_RESULT: ${{ needs.bats-shard.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANGED_RESULT}" != 'success' ]]; then
            printf 'changed-tests did not succeed (%s)\n' "${CHANGED_RESULT}" >&2
            exit 1
          fi
          case "${RUN}" in
            false)
              printf 'no test-relevant changes; the suite did not need to run\n'
              ;;
            true)
              if [[ "${SHARDS_RESULT}" != 'success' ]]; then
                printf 'bats shards did not all succeed (%s)\n' "${SHARDS_RESULT}" >&2
                exit 1
              fi
              printf 'every bats shard passed\n'
              ;;
            *)
              printf 'changed-tests produced no run decision (%s)\n' "${RUN}" >&2
              exit 1
              ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always() && needs.changed-tests.outputs.run == 'true'
        with:
          pattern: bats-junit-*
          merge-multiple: true
          path: bats-junit
      - uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always() && needs.changed-tests.outputs.run == 'true'
        with:
          report_paths: bats-junit/*.xml
          check_name: BATS results
          fail_on_failure: true
  review:
    name: reviewdog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443 codeload.github.com:443 github.com:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          reporter: github-pr-review
          level: warning
          fail_on_error: false
          exclude: |
            ./scripts/other/*
            ./lib/*
            ./.shdoc/*
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      # submodules: the suite's last step builds the docs, and .ci/build-docs
      # runs shdoc out of the .shdoc submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run lint suite
        run: ./.ci/in-devshell ./.ci/run-lint-checks
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run governance suite
        run: ./.ci/in-devshell ./.ci/run-governance-checks
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run commitlint
        id: commitlint
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          # The range arrives through env: rather than interpolated into this
          # body, which would be the template-injection sink zizmor audits for.
          if [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            from="${PR_BASE_SHA}"
            to="${PR_HEAD_SHA}"
          else
            from="${PUSH_BEFORE_SHA}"
            to="${GITHUB_SHA}"
          fi
          # An all-zero before-SHA means the ref did not exist prior to this
          # push, so there is no range to walk; lint the tip commit alone.
          if [[ "${from}" =~ ^0+$ ]]; then
            ./.ci/in-devshell commitlint --last --verbose
          else
            ./.ci/in-devshell commitlint --from "${from}" --to "${to}" --verbose
          fi
  nix-flake-check:
    name: nix-flake-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run nix flake check
        run: ./.ci/in-devshell ./.ci/check-flake-eval-warnings
  # The Codecov upload lives in coverage.yml, which is push-triggered so it can
  # carry CODECOV_TOKEN (.ci/check-pr-workflows-no-secrets forbids any
  # non-GITHUB_TOKEN secret in a PR-triggered file). These jobs are the PR half:
  # they produce the reports as downloadable artifacts and upload nothing.
  #
  # coverage is not a required check, but it is gated on changed-tests like the
  # bats shards, so a PR that changes no test-relevant files does not re-run the
  # suite under kcov. There is one scope per Codecov flag (functions, gates,
  # root, shims; see .github/actions/coverage). Each scope's suite is split by
  # .ci/plan-test-shards across separate kcov processes. Counts are chosen so no
  # shard's weighted cost (.ci/test-shard-weights) exceeds the largest
  # single-file cost the scope cannot be split below, so a large file sets the
  # wall time and a small suite takes a count of 1. A count of 1 still goes
  # through the shard-and-merge path, so every scope reports the same way. The
  # coverage job recombines each scope's shards with `kcov --merge`; the merged
  # report has the same total-line and covered-line sets as a single run as
  # long as every shard ran its whole slice, which the coverage action checks.
  # Each scope's count appears twice, here and in the coverage job's matrix; its
  # merge step fails when the number of shard reports it downloads differs from
  # its count. A count of 1 merges the download directory itself, because
  # download-artifact does not create a per-artifact directory for a lone match.
  coverage-shard:
    name: coverage-shard (${{ matrix.scope }} ${{ matrix.index }})
    needs: changed-tests
    if: github.event_name == 'pull_request' && needs.changed-tests.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: functions, count: 2, index: 0}
          - {scope: functions, count: 2, index: 1}
          - {scope: gates, count: 3, index: 0}
          - {scope: gates, count: 3, index: 1}
          - {scope: gates, count: 3, index: 2}
          - {scope: root, count: 1, index: 0}
          - {scope: shims, count: 1, index: 0}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/coverage # zizmor: ignore[self-repository]
        with:
          scope: ${{ matrix.scope }}
          shard-count: ${{ matrix.count }}
          shard-index: ${{ matrix.index }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.scope }}-${{ matrix.index }}
          path: ${{ runner.temp }}/coverage/${{ matrix.scope }}/
          if-no-files-found: error
  coverage:
    name: coverage (${{ matrix.scope }})
    needs: coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scope: functions, count: 2}
          - {scope: gates, count: 3}
          - {scope: root, count: 1}
          - {scope: shims, count: 1}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nix-installer20230104193028379800000001.s3.dualstack.us-east-2.amazonaws.com:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` waits on actionlint support; this job runs its own commit, so `./` is the same tree.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      # Without merge-multiple, two or more matching artifacts each land in
      # their own directory named after them, which is the one-directory-per-run
      # layout kcov --merge reads; a single match lands in the path itself.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-${{ matrix.scope }}-*
          path: ${{ runner.temp }}/shards
      - name: Merge shard reports
        env:
          SCOPE: ${{ matrix.scope }}
          SHARD_COUNT: ${{ matrix.count }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          # download-artifact extracts a lone matching artifact straight into
          # its path, with no coverage-shard-<scope>-<n>/ directory, so a count
          # of 1 has no subdirectory to glob. The report is then the download
          # directory itself, recognised by the bats/cobertura.xml every shard
          # writes.
          if ((SHARD_COUNT == 1)); then
            if [[ ! -s "${RUNNER_TEMP}/shards/bats/cobertura.xml" ]]; then
              printf 'expected 1 %s shard report, found none\n' "${SCOPE}" >&2
              exit 1
            fi
            shards=("${RUNNER_TEMP}/shards")
          else
            shards=("${RUNNER_TEMP}/shards/coverage-shard-${SCOPE}-"*/)
            if ((${#shards[@]} != SHARD_COUNT)); then
              printf 'expected %s %s shard reports, found %s\n' "${SHARD_COUNT}" "${SCOPE}" "${#shards[@]}" >&2
              exit 1
            fi
          fi
          # kcov --merge writes kcov-merged/cobertura.xml under its output
          # directory, which it creates only one level deep, so without the
          # parent it dies with "Can't open directory" before merging anything.
          mkdir --parents "${RUNNER_TEMP}/coverage"
          ./.ci/in-devshell kcov --merge "${RUNNER_TEMP}/coverage/${SCOPE}" "${shards[@]}"
          if [[ ! -s "${RUNNER_TEMP}/coverage/${SCOPE}/kcov-merged/cobertura.xml" ]]; then
            printf 'kcov --merge wrote no %s cobertura.xml\n' "${SCOPE}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-${{ matrix.scope }}
          path: ${{ runner.temp }}/coverage/
          # coverage runs under `if: always()` as a best-effort debug
          # artifact; warn is correct here (allowlisted in
          # .ci/check-upload-artifact-strict).
          if-no-files-found: warn
