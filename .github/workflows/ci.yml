name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-scripts:
    name: check-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run check-scripts
        run: ./.ci/in-devshell ./check-scripts
  bats:
    name: bats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0 # full history so changed-tests can diff the PR range
      # This job is a required check, so it must always run and report a status.
      # changed-tests only gates the heavy steps below — when nothing
      # test-relevant changed the job still succeeds, reporting green quickly.
      - id: changes
        uses: ./.github/actions/changed-tests
      - uses: ./.github/actions/setup
        if: steps.changes.outputs.run == 'true'
      - name: Run BATS
        if: steps.changes.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC2016 # $(nproc) must run inside the in-devshell
          # bash -c, not in the runner shell — the whole invocation belongs on the
          # hermetic side of the boundary; single quotes intended.
          ./.ci/in-devshell bash -c '
            set -Eeuo pipefail
            mkdir -p bats-junit
            bats --jobs "$(nproc)" --recursive \
              --print-output-on-failure \
              --report-formatter junit --output bats-junit \
              test/functions test/ci test/root
          '
      - uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always() && steps.changes.outputs.run == 'true'
        with:
          report_paths: bats-junit/*.xml
          check_name: BATS results
          fail_on_failure: true
  review:
    name: reviewdog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443 codeload.github.com:443 github.com:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6 # v1.32.1
        with:
          reporter: github-pr-review
          level: warning
          fail_on_error: false
          exclude: |
            ./scripts/other/*
            ./lib/*
            ./.shdoc/*
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run lint suite
        run: ./.ci/in-devshell ./.ci/run-lint-checks
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run governance suite
        run: ./.ci/in-devshell ./.ci/run-governance-checks
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >-
            api.github.com:443 auth.docker.io:443 codeload.github.com:443 github.com:443 objects.githubusercontent.com:443 production.cloudflare.docker.com:443 registry-1.docker.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
  nix-flake-check:
    name: nix-flake-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run nix flake check
        run: ./.ci/in-devshell ./.ci/check-flake-eval-warnings
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Codecov upload lives in coverage.yml, which is push-triggered so it
    # can carry CODECOV_TOKEN (.ci/check-pr-workflows-no-secrets forbids any
    # non-GITHUB_TOKEN secret in a PR-triggered file). This job is the PR half:
    # it produces the report as a downloadable artifact and uploads nothing.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0 # full history so changed-tests can diff the PR range
      # coverage is not a required check, but gate it the same way as bats so a
      # PR that changes no test-relevant files does not spend ~9 min re-running
      # the whole suite under kcov.
      - id: changes
        uses: ./.github/actions/changed-tests
      - uses: ./.github/actions/setup
        if: steps.changes.outputs.run == 'true'
      # Both scopes run as steps of this one job rather than as two jobs, unlike
      # coverage.yml. Nothing is uploaded here, so there is no per-upload egress
      # to isolate, and the gates suite adds only ~2.5 min against the functions
      # suite's ~9 — not worth duplicating a job preamble for.
      - uses: ./.github/actions/coverage
        if: steps.changes.outputs.run == 'true'
        with:
          scope: functions
      - uses: ./.github/actions/coverage
        if: steps.changes.outputs.run == 'true'
        with:
          scope: gates
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage/
          # coverage runs under `if: always()` as a best-effort debug
          # artifact; warn is correct here (allowlisted in
          # .ci/check-upload-artifact-strict).
          if-no-files-found: warn
