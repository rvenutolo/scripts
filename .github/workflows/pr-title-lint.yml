name: pr-title-lint
# Under the merge-commit-only policy the PR title becomes the merge-commit
# subject, so it must satisfy the same Conventional Commits rules as branch
# commits (enforced by commitlint).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-pr-title:
    name: lint-pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 codeload.github.com:443 github.com:443 hosted-compute-*.githubapp.com:443 install.determinate.systems:443 nixos.org:443 objects.githubusercontent.com:443 releases.nixos.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          # PR_TITLE is attacker-influenced PR text, so it is not on .ci/in-devshell's
          # fixed --keep list; this appends it for this step alone.
          IN_DEVSHELL_KEEP: PR_TITLE
        run: |
          # shellcheck disable=SC2016 # ${PR_TITLE} must expand inside the inner
          # bash -c (which has PR_TITLE from the env: block), not the runner
          # shell — single quotes intended; this avoids PR-title injection.
          ./.ci/in-devshell bash -c \
            'printf "%s\n" "${PR_TITLE}" | commitlint --config .commitlintrc.yml'
