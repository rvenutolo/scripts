name: Links
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          # lychee crawls every external URL in the repo's markdown, so this
          # list must cover those hosts plus anything they redirect to.
          allowed-endpoints: >-
            api.github.com:443 app.codecov.io:443 codecov.io:443 codeload.github.com:443 direnv.net:443 github.com:443 img.shields.io:443 nixos.org:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 rvenutolo.github.io:443 www.conventionalcommits.org:443
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --config .lycheerc --no-progress --verbose './**/*.md'
          fail: true
