name: Links
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-sudo: true
          # lychee crawls every external URL in the repo's markdown, so this
          # list must cover those hosts plus anything they redirect to.
          allowed-endpoints: >-
            api.github.com:443 app.codecov.io:443 codecov.io:443 codeload.github.com:443 direnv.net:443 github.com:443 img.shields.io:443 nixos.org:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 rvenutolo.github.io:443 www.conventionalcommits.org:443
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lycheerc --no-progress --verbose './**/*.md'
          fail: true
