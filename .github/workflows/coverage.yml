name: Coverage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # keybase.io is load-bearing, not incidental: codecov.sh fetches the
          # Codecov signing key from it to verify the CLI. Blocked, the fetch
          # returns empty and the signature check fails. See CLAUDE.md.
          allowed-endpoints: >-
            api.github.com:443 cache.nixos.org:443 channels.nixos.org:443 cli.codecov.io:443 codeload.github.com:443 github.com:443 ingest.codecov.io:443 install.determinate.systems:443 keybase.io:443 nixos.org:443 objects.githubusercontent.com:443 raw.githubusercontent.com:443 releases.nixos.org:443 rubygems.org:443 tarballs.nixos.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # MUST stay true. With it false, codecov.sh's exit_if_error only
          # prints and returns, so a failed GPG verification falls through to
          # `chmod +x` and the CLI runs unverified (#199), and a rejected
          # upload reports green (#200). Enforced by .ci/check-codecov-strict.
          fail_ci_if_error: true
